
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b57">
  <title>旅みやげMAP Ver.3.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f5f7f5;
      color: #24342d;
    }
    header {
      background: #176b57;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; font-size: 14px; }
    main {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px #0000000d;
    }
    .version { color: #176b57; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>🧳 旅みやげMAP</h1>
    <p>旅行のおみやげを楽しく管理</p>
  </header>
  <main>
    <div class="card">
      <p class="version">Ver.3.0</p>
      <h2>新しい旅の準備を始めましょう</h2>
      <p>旅みやげMAPの新しいアプリを準備しています。</p>
      <p>旅行・商品・購入数量・写真・店舗マップを
      このアプリで管理できるようにします。</p>
    </div>
  </main>
</body>
</html>
