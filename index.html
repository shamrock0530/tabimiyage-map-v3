
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b57">
  <title>旅みやげMAP Ver.3.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f5f7f5;
      color: #24342d;
    }
    header {
      background: #176b57;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; font-size: 14px; }
    main {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px #0000000d;
    }
    .version { color: #176b57; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>🧳 旅みやげMAP</h1>
    <p>旅行のおみやげを楽しく管理</p>
  </header>
  <main>
    <div class="card">
      <p class="version">Ver.3.0</p>
      <h2>新しい旅の準備を始めましょう</h2>
      <p>旅みやげMAPの新しいアプリを準備しています。</p>
      <p>旅行・商品・購入数量・写真・店舗マップを
      このアプリで管理できるようにします。</p>
    </div>

    <section class="card" style="margin-top:20px">
      <h2>旅行を登録する</h2>
      <form id="tripForm">
        <p>
          <label for="tripName">旅行名</label>
          <input id="tripName" type="text"
                 placeholder="例：仙台旅行" required
                 style="display:block;width:100%;padding:12px;margin-top:8px">
        </p>
        <p>
          <label for="tripDate">旅行日</label>
          <input id="tripDate" type="date"
                 style="display:block;width:100%;padding:12px;margin-top:8px">
        </p>
        <button type="submit"
                style="padding:12px 20px;background:#176b57;color:white;border:0;border-radius:8px">
          旅行を登録
        </button>
      </form>
    </section>

    <section class="card" style="margin-top:20px">
      <h2>登録済みの旅行</h2>
      <div id="tripList"></div>
    </section>

    <section class="card" style="margin-top:20px">
      <h2>おみやげ商品を登録する</h2>

      <form id="productForm">
        <p>
          <label for="productTrip">旅行を選択</label>
          <select id="productTrip" required
                  style="display:block;width:100%;padding:12px;margin-top:8px">
          </select>
        </p>

        <p>
          <label for="productName">商品名</label>
          <input id="productName" type="text"
                 placeholder="例：ずんだ餅" required
                 style="display:block;width:100%;padding:12px;margin-top:8px">
        </p>

        <p>
          <label for="productQuantity">購入予定数量</label>
          <input id="productQuantity" type="number" inputmode="numeric" min="1" step="1" value="1" required
                 style="display:block;width:100%;padding:12px;margin-top:8px">
        </p>

        <button type="submit"
                style="padding:12px 20px;background:#176b57;color:white;border:0;border-radius:8px">
          商品を登録
        </button>
      </form>
    </section>

    <section class="card" style="margin-top:20px">
      <h2>登録済みのおみやげ</h2>
      <div id="productList"></div>
    </section>
  </main>
  <script src="./app.js?v=3.0.6" defer></script>
</body>
</html>
